name: Update GitHub Stats

on:
  schedule:
    - cron: '0 1 * * 1'   # каждый понедельник в 01:00 UTC
  workflow_dispatch:        # ручной запуск при необходимости

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source (gpages branch)
        uses: actions/checkout@v4
        with:
          ref: gpages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Fetch repo stats from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-stats.js

      - name: Commit if constants changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/constants/index.js
          git diff --cached --quiet \
            && echo "Nothing to commit." \
            || git commit -m "chore: update GitHub repo stats [skip ci]"

      - name: Push updated constants
        run: git push origin gpages

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        run: |
          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          npx gh-pages -d build \
            --user "github-actions[bot] <github-actions[bot]@users.noreply.github.com>" \
            --message "deploy: update GitHub stats [skip ci]"
