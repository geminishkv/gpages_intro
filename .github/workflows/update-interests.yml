name: Update Interests

on:
  schedule:
    - cron: '0 7 * * 1'   # каждый понедельник в 07:00 UTC
  workflow_dispatch:        # ручной запуск

permissions:
  contents: write
  actions: none
  checks: none
  deployments: none
  issues: none
  packages: none
  pull-requests: none
  security-events: none
  statuses: none

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source (gpages branch)
        uses: actions/checkout@v4
        with:
          ref: gpages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Fetch gaming stats + update trophy photos
        run: node scripts/update-gaming.js
        env:
          STRATEGE_COOKIE: ${{ secrets.STRATEGE_COOKIE }}

      - name: Commit photos + data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/gaming.json public/img/gaming/psn/ public/img/gaming/xbox/
          git diff --cached --quiet \
            && echo "Nothing to commit." \
            || git commit -m "chore: update gaming stats + photos [skip ci]"

      - name: Push updated data
        run: git push origin gpages

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Build
        run: npm run build
        env:
          REACT_APP_YM_ID: ${{ secrets.YM_ID }}

      - name: Deploy to gh-pages
        run: |
          git remote set-url origin \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          npx gh-pages -d build \
            --user "github-actions[bot] <github-actions[bot]@users.noreply.github.com>" \
            --message "deploy: update interests [skip ci]"
