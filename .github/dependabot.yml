version: 2
updates:
  # Пины actions по SHA обновляет Dependabot (security-baseline: CI/CD).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # react-scripts 5 (CRA) pins the toolchain: React 19, ESLint 9+ and animejs 4
    # each need a migration first, so their majors are taken by hand, not by PR.
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: animejs
        update-types: ["version-update:semver-major"]
